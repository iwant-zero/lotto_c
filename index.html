<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>로또 추천기 (빈도+분산 / 랜덤 없음)</title>
  <style>
    :root { --bg:#0b1020; --card:#121a33; --txt:#eaf0ff; --muted:#97a3c5; --line:#23305c; }
    body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif;}
    .wrap{max-width:980px;margin:0 auto;padding:18px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;}
    h1{font-size:18px;margin:0 0 8px;}
    .muted{color:var(--muted);font-size:13px;line-height:1.45;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;}
    button{border:1px solid var(--line);background:#0f1730;color:var(--txt);padding:10px 12px;border-radius:12px;font-weight:700;cursor:pointer;}
    button.active{outline:2px solid #4e6bff;}
    .sets{margin-top:14px;display:grid;gap:10px;}
    .set{background:#0f1730;border:1px solid var(--line);border-radius:14px;padding:12px;}
    .set h3{margin:0 0 8px;font-size:14px;color:#cfe0ff;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
    .tag{font-size:12px;color:var(--muted);font-weight:700;}
    .balls{display:flex;gap:8px;flex-wrap:wrap}
    .ball{
      width:38px;height:38px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      font-weight:900;letter-spacing:0.5px;
      border:1px solid rgba(255,255,255,.25);
      box-shadow:0 8px 18px rgba(0,0,0,.25);
      user-select:none;
    }
    .b1{background:#f5c542;color:#151515;}   /* 1-10 */
    .b2{background:#4aa3ff;}                 /* 11-20 */
    .b3{background:#ff5a6a;}                 /* 21-30 */
    .b4{background:#a9b3c8;color:#10131c;}   /* 31-40 */
    .b5{background:#49d17a;color:#0b1a12;}   /* 41-45 */
    .err{margin-top:10px;color:#ffb4b4;font-weight:800;}
    code{background:#0a1025;border:1px solid var(--line);padding:2px 6px;border-radius:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>로또 추천기 (랜덤 없음 / 빈도 + 분산 규칙)</h1>
      <div id="status" class="muted">데이터 불러오는 중…</div>

      <div class="row">
        <div class="muted" style="font-weight:900;">세트 수:</div>
        <button class="cnt active" data-cnt="1">1세트</button>
        <button class="cnt" data-cnt="5">5세트</button>
        <button class="cnt" data-cnt="10">10세트</button>

        <button id="gen" style="margin-left:auto;">추천 생성(새 조합)</button>
        <button id="same">같은 조합 재생성</button>
        <button id="reset">조합 초기화</button>
      </div>

      <div id="error" class="err" style="display:none;"></div>
      <div id="out" class="sets"></div>

      <div class="muted" style="margin-top:14px;">
        * 랜덤(Math.random) 사용 없음. 버튼 누를 때마다 <b>조합 순번(cycle)</b>을 바꿔 다른 규칙 프리셋을 적용합니다.<br/>
        * 데이터는 <code>data/lotto.json</code> (update-lotto로 갱신)
      </div>
    </div>
  </div>

<script>
  const $ = (s)=>document.querySelector(s);
  const $$ = (s)=>Array.from(document.querySelectorAll(s));

  let draws = [];
  let setCount = 1;

  // ✅ 랜덤 없이 "버튼 클릭"으로만 변하는 결정적 사이클
  let cycle = Number(localStorage.getItem("lotto_cycle") || "0");

  // ✅ 같은 cycle에서 "출력 순서만" 회전시키는 값
  let rotate = Number(localStorage.getItem("lotto_rotate") || "0");

  function ballClass(n){
    if(n<=10) return "b1";
    if(n<=20) return "b2";
    if(n<=30) return "b3";
    if(n<=40) return "b4";
    return "b5";
  }

  function readNums(d){
    return [d.drwtNo1,d.drwtNo2,d.drwtNo3,d.drwtNo4,d.drwtNo5,d.drwtNo6].map(Number);
  }

  function buildFreq(draws){
    const f = Array(46).fill(0);
    for(const d of draws){
      for(const n of readNums(d)){
        if(Number.isInteger(n) && n>=1 && n<=45) f[n]++;
      }
    }
    return f;
  }

  function sortedByFreq(freq){
    const arr = [];
    for(let n=1;n<=45;n++) arr.push(n);
    arr.sort((a,b)=>(freq[b]-freq[a]) || (a-b));
    return arr;
  }

  // ✅ list에서 "offset" 기반으로 하나 선택 (랜덤 없음)
  function pickFrom(list, used, offset, pred=()=>true){
    for(let i=0;i<list.length;i++){
      const n = list[(i + offset) % list.length];
      if(!used.has(n) && pred(n)){
        used.add(n);
        return n;
      }
    }
    return null;
  }

  const PRESET_NAME = [
    "구간 분산 + 중간대 보강",
    "홀짝 3:3 + 상위빈도 중심",
    "끝수 분산(0~9 최대) + 빈도",
    "핫/미드/콜드 3/2/1 믹스"
  ];

  // ✅ 랜덤 없음. cycle(salt)에 의해 결정되는 추천(번호 자체는 결정적)
  function makeSet(base, idx, salt){
    const used = new Set();

    const hot  = base.slice(0, 12);
    const mid  = base.slice(12, 30);
    const cold = base.slice(-12);

    const pattern = (idx + salt) % 4;

    const O1 = salt * 7 + idx * 3;
    const O2 = salt * 11 + idx * 5;
    const O3 = salt * 13 + idx * 7;
    const O4 = salt * 17 + idx * 9;

    if(pattern === 0){
      const ranges=[[1,10],[11,20],[21,30],[31,40],[41,45]];
      for(let r=0;r<ranges.length;r++){
        const [a,b]=ranges[r];
        pickFrom(base, used, O1 + r*4, (n)=>n>=a && n<=b);
      }
      pickFrom(base, used, O2 + 1, (n)=>n>=11 && n<=35);
    }

    if(pattern === 1){
      for(let i=0;i<3;i++) pickFrom(hot, used, O1 + i*2, n=>n%2===1);
      for(let i=0;i<3;i++) pickFrom(hot, used, O2 + i*2, n=>n%2===0);
    }

    if(pattern === 2){
      const usedLast = new Set();
      for(let i=0;i<6;i++){
        const n = pickFrom(base, used, O3 + i*6, x=>!usedLast.has(x%10));
        if(n!=null) usedLast.add(n%10);
      }
      while(used.size<6) pickFrom(base, used, O4 + used.size);
    }

    if(pattern === 3){
      for(let i=0;i<3;i++) pickFrom(hot, used, O1 + i*3);
      for(let i=0;i<2;i++) pickFrom(mid, used, O2 + i*4);
      pickFrom(cold, used, O3 + 7);
    }

    const res = Array.from(used).sort((a,b)=>a-b);
    while(res.length<6){
      const n = pickFrom(base, used, O4 + res.length*7);
      if(n==null) break;
      res.push(n);
      res.sort((a,b)=>a-b);
    }

    return { nums: res, preset: PRESET_NAME[pattern] };
  }

  // ✅ 배열 순서만 회전(내용 동일)
  function rotateArray(arr, k){
    const n = arr.length;
    if(n === 0) return arr;
    const r = ((k % n) + n) % n;
    if(r === 0) return arr;
    return arr.slice(r).concat(arr.slice(0, r));
  }

  function render(recs){
    const out = $("#out");
    out.innerHTML = "";

    const shown = rotateArray(recs, rotate);

    shown.forEach((obj, i)=>{
      const nums = obj.nums;
      const div = document.createElement("div");
      div.className="set";

      const head = document.createElement("h3");
      head.innerHTML = `<span>${i+1}번 세트</span><span class="tag">${obj.preset} · cycle=${cycle} · rotate=${rotate}</span>`;
      div.appendChild(head);

      const balls = document.createElement("div");
      balls.className = "balls";

      nums.forEach(n=>{
        const b = document.createElement("div");
        b.className = `ball ${ballClass(n)}`;
        b.textContent = String(n).padStart(2,"0");
        balls.appendChild(b);
      });

      div.appendChild(balls);
      out.appendChild(div);
    });
  }

  async function loadData(){
    const err = $("#error");
    err.style.display = "none";
    err.textContent = "";

    let res, text;
    try{
      res = await fetch("./data/lotto.json", { cache:"no-store" });
      text = await res.text();
    }catch(e){
      err.style.display="block";
      err.textContent = "추천 번호 오류: 데이터 파일을 불러오지 못했습니다: 네트워크/경로 오류";
      return false;
    }

    if(!res.ok){
      err.style.display="block";
      err.textContent = `추천 번호 오류: 데이터 파일을 불러오지 못했습니다: ${res.status} (./data/lotto.json)`;
      return false;
    }

    try{
      draws = JSON.parse(text);
    }catch(e){
      err.style.display="block";
      err.textContent = "추천 번호 오류: lotto.json이 JSON 형식이 아닙니다.";
      return false;
    }

    if(!Array.isArray(draws) || draws.length===0){
      err.style.display="block";
      err.textContent = "추천 번호 오류: 데이터가 비어있습니다 (data/lotto.json = []). update-lotto로 먼저 채우세요.";
      return false;
    }

    const last = draws[draws.length-1];
    $("#status").textContent =
      `데이터 ${draws.length}회차 (최근: ${last.drwNo} / ${last.drwNoDate}) · cycle=${cycle} · rotate=${rotate}`;
    return true;
  }

  function generate(changeCycle){
    if(!Array.isArray(draws) || draws.length===0) return;

    if(changeCycle){
      cycle = (cycle + 1) % 100000;
      localStorage.setItem("lotto_cycle", String(cycle));
      // 새 조합이면 rotate도 0으로 리셋(원하면 유지해도 됨)
      rotate = 0;
      localStorage.setItem("lotto_rotate", String(rotate));
    }

    const last = draws[draws.length-1];
    $("#status").textContent =
      `데이터 ${draws.length}회차 (최근: ${last.drwNo} / ${last.drwNoDate}) · cycle=${cycle} · rotate=${rotate}`;

    const freq = buildFreq(draws);
    const base = sortedByFreq(freq);

    const recs = [];
    for(let i=0;i<setCount;i++){
      recs.push(makeSet(base, i, cycle));
    }
    render(recs);
  }

  $$(".cnt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      $$(".cnt").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      setCount = Number(btn.dataset.cnt);

      // 세트 수가 바뀌면 rotate가 범위를 벗어날 수 있으니 정리
      rotate = rotate % setCount;
      localStorage.setItem("lotto_rotate", String(rotate));

      generate(false);
    });
  });

  // ✅ 새 조합(번호 자체 변경)
  $("#gen").addEventListener("click", ()=>generate(true));

  // ✅ 같은 cycle 유지 + "세트 순서만" 회전
  $("#same").addEventListener("click", ()=>{
    rotate = (rotate + 1) % setCount; // 1칸 회전
    localStorage.setItem("lotto_rotate", String(rotate));
    generate(false); // 번호는 동일, 출력 순서만 달라짐
  });

  // ✅ 초기화(둘 다 초기화)
  $("#reset").addEventListener("click", ()=>{
    cycle = 0;
    rotate = 0;
    localStorage.setItem("lotto_cycle", "0");
    localStorage.setItem("lotto_rotate", "0");
    generate(false);
  });

  (async ()=>{
    const ok = await loadData();
    if(ok) generate(false);
  })();
</script>
</body>
</html>
