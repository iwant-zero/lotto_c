name: Lotto IssueOps + Scheduled Update

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: "update or recommend"
        required: true
        default: "update"
      sets:
        description: "1|5|10"
        required: true
        default: "10"
  schedule:
    # 토요일 21:10 KST = 12:10 UTC
    - cron: "10 12 * * 6"

permissions:
  contents: write
  issues: write

jobs:
  issueops:
    runs-on: ubuntu-latest

    # issues 이벤트면 update-lotto / lotto 라벨일 때만 실행
    if: >
      github.event_name != 'issues' ||
      github.event.label.name == 'update-lotto' ||
      github.event.label.name == 'lotto'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide mode/sets
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            if [ "${{ github.event.label.name }}" = "update-lotto" ]; then
              echo "mode=update" >> $GITHUB_OUTPUT
            else
              echo "mode=recommend" >> $GITHUB_OUTPUT
            fi
            echo "sets=10" >> $GITHUB_OUTPUT
          else
            echo "mode=${{ inputs.mode || 'update' }}" >> $GITHUB_OUTPUT
            echo "sets=${{ inputs.sets || '10' }}" >> $GITHUB_OUTPUT
          fi

      - name: Update lotto data (update-lotto)
        if: steps.cfg.outputs.mode == 'update'
        run: node scripts/update_lotto.mjs

      - name: Commit & push (only if changed)
        if: steps.cfg.outputs.mode == 'update'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/lotto.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "chore: update lotto data"
          git push

      - name: Build comment body
        id: body
        run: |
          node scripts/recommend.mjs ${{ steps.cfg.outputs.sets }} > comment.md

      - name: Comment to issue (issues only)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("comment.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
