name: Lotto IssueOps + Scheduled Update

on:
  workflow_dispatch:
  issues:
    types: [labeled]
  schedule:
    - cron: "20 12 * * 6" # 매주 토요일 21:20 KST (UTC 12:20)

permissions:
  contents: write
  issues: write

concurrency:
  group: lotto-issueops
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    # issues 이벤트일 때는 update-lotto / lotto 라벨만 처리
    if: |
      github.event_name != 'issues' ||
      github.event.label.name == 'update-lotto' ||
      github.event.label.name == 'lotto'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # update-lotto 라벨 또는 schedule/dispatch면 데이터 갱신
      - name: Update lotto data
        if: github.event_name != 'issues' || github.event.label.name == 'update-lotto'
        run: node scripts/update_lotto.mjs

      - name: Commit updated data
        if: github.event_name != 'issues' || github.event.label.name == 'update-lotto'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update lotto data"
          file_pattern: "data/lotto.json"

      # issues 이벤트면 추천 메시지 생성
      - name: Build recommendation
        if: github.event_name == 'issues'
        id: rec
        run: |
          OUT="$(node scripts/recommend.mjs || true)"
          echo "msg<<EOF" >> $GITHUB_OUTPUT
          echo "$OUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # issues 댓글로 출력
      - name: Comment on Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const msg = `${{ steps.rec.outputs.msg }}`.trim();
            const pages = `https://${context.repo.owner}.github.io/${context.repo.repo}/`;

            let body =
              (msg && msg !== "NO_DATA")
                ? `${msg}\n\n🔗 Pages: ${pages}`
                : `⚠️ data/lotto.json이 비어있습니다.\n라벨 **update-lotto**로 먼저 데이터 수집을 실행하세요.\n\n🔗 Pages: ${pages}`;

            body += `\n\n---\n라벨 안내\n- **update-lotto**: 당첨 데이터 갱신(+커밋) + 추천 댓글\n- **lotto**: 현재 데이터 기준 추천 댓글만`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
