name: Lotto IssueOps + Scheduled Update

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: "update or recommend"
        required: true
        default: "update"
      sets:
        description: "1|5|10"
        required: true
        default: "10"
  schedule:
    # 토요일 21:10 KST = 12:10 UTC
    - cron: "10 12 * * 6"

permissions:
  contents: write
  issues: write

concurrency:
  group: lotto-issueops
  cancel-in-progress: false

jobs:
  issueops:
    runs-on: ubuntu-latest

    # issues 이벤트면 update-lotto / lotto 라벨일 때만 실행
    if: >
      github.event_name != 'issues' ||
      github.event.label.name == 'update-lotto' ||
      github.event.label.name == 'lotto'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ✅ "진짜 어떤 파일이 실행되는지" 강제 확인용 로그
      - name: Debug - confirm script version
        run: |
          echo "EVENT: ${{ github.event_name }}"
          echo "LABEL: ${{ github.event.label.name }}"
          echo "HEAD COMMIT:"
          git rev-parse HEAD
          echo "update_lotto.mjs sha256:"
          sha256sum scripts/update_lotto.mjs
          echo "update_lotto.mjs first 40 lines:"
          sed -n '1,40p' scripts/update_lotto.mjs
          echo "-----"
          echo "lotto.json exists?"
          ls -la data || true
          ls -la data/lotto.json || true

      - name: Decide mode/sets
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            if [ "${{ github.event.label.name }}" = "update-lotto" ]; then
              echo "mode=update" >> $GITHUB_OUTPUT
            else
              echo "mode=recommend" >> $GITHUB_OUTPUT
            fi
            echo "sets=10" >> $GITHUB_OUTPUT
          else
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
            echo "sets=${{ inputs.sets }}" >> $GITHUB_OUTPUT
          fi

      - name: Update lotto data (update-lotto)
        if: steps.cfg.outputs.mode == 'update'
        run: node scripts/update_lotto.mjs

      # ✅ 데이터가 비었으면 실패로 처리(성공처럼 넘어가면 UI가 계속 []임)
      - name: Verify data not empty
        if: steps.cfg.outputs.mode == 'update'
        run: |
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('data/lotto.json','utf8')); if(!Array.isArray(a)||a.length===0){console.error('lotto.json is empty'); process.exit(1);} console.log('lotto.json OK length=',a.length);"

      - name: Commit & push (only if changed)
        if: steps.cfg.outputs.mode == 'update'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/lotto.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "chore: update lotto data"
          git push

      - name: Build comment body
        run: |
          node scripts/recommend.mjs ${{ steps.cfg.outputs.sets }} > comment.md
          echo "" >> comment.md
          echo "---" >> comment.md
          echo "_데이터 파일: ./data/lotto.json_" >> comment.md

      - name: Comment to issue (issues only)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("comment.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
